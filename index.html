<!DOCTYPE html>                                                      <!--This line tells the browser "This is a HTML5 File document". It's usually the first line of every modern HTML Page -->
<html lang="en">                                                     <!-- "<html>....<html>" this wraps the entire code. Usually the contents are written between these characters."-->
<head>                                                               <!-- Information about the page that the user doesn't directly see. Example: The Page title etc.-->
    <meta charset="UTF-8">                                           <!--Tells the browser the file uses UTF-8 character encoding, which means it can display characters from any language including emoji. Always include this.-->
    <title>Memory House</title>                                      <!--What appears on the browser tab. Not on the page itself.-->
<head>
<body>                                                               <!-- "<body>....</body" - Everything between these appears on the webpage. -->
    <h1>Memory House</h1>                                            <!--Header you could see on the Web Page-->
    <p>A Photography Portfolio organized by the Hours of the Day, by Hritik.</p> <!--Paragraph you could see on the Web Page-->
</body>
<html>
